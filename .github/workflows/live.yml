name: Update live APIMS buffer

on:
  schedule:
    - cron: "50 * * * *"      # DOE publishes the hourly reading around :30-:40; fetch at :50
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-apims
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy pandas requests
      - name: Fetch DOE hourly API and roll the 120 h buffer
        run: python -m hazeshaman.live --out docs/live.json
      - name: Commit if changed
        run: |
          git config user.name "hazeshaman-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/live.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore(live): APIMS hourly buffer $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
